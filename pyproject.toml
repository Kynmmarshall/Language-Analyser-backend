[project]
name = "yaounde-analyzer"
version = "0.1.0"
description = "Lexical and syntactic analyzer for Cameroonian Francanglais collected in Yaounde"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "pyright>=1.1.380",
    "httpx>=0.27",
]

[project.scripts]
yaounde-analyzer = "yaounde_analyzer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yaounde_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Autogenerated Alembic revision files are not hand-formatted to project style.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Cookie()/Header() in argument defaults is the required idiom.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["yaounde_analyzer"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
