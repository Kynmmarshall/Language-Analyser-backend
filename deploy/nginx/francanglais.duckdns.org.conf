# Francanglais Studio -- Nginx site.
#
# Topology: Nginx serves the built SPA from disk and reverse-proxies /api to the
# container on 127.0.0.1:8010. Browser sees ONE origin, so session cookies work
# without relaxing SameSite and no CORS preflight is involved.
#
# Install:
#   sudo cp francanglais.duckdns.org.conf /etc/nginx/sites-available/francanglais
#   sudo ln -s /etc/nginx/sites-available/francanglais /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Run certbot AFTER this file is in place on port 80; it rewrites the server blocks
# to add TLS and the http->https redirect.

server {
    listen 80;
    listen [::]:80;
    server_name francanglais.duckdns.org;

    root /var/www/francanglais;
    index index.html;

    access_log /var/log/nginx/francanglais.access.log;
    error_log  /var/log/nginx/francanglais.error.log;

    # Uploaded statements are small; this also caps abuse.
    client_max_body_size 1m;

    # --- Security headers ---------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --- API ----------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8010;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # CSV/JSON evidence exports can take a moment on a small VPS.
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # --- Static assets ------------------------------------------------------
    # Vite emits content-hashed filenames under /assets, so they are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback -------------------------------------------------------
    # Client-side routes (/corpus, /grammar, /statistics, /export) have no file on
    # disk; without this they 404 on refresh or direct navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or clients keep loading stale asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
