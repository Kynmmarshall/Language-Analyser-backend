services:
  api:
    build: .
    image: francanglais-studio-api:local
    restart: unless-stopped
    # Loopback-only by default, per the production plan: bind behind a reverse proxy,
    # never expose the app port directly. Override with `ports: ["8010:8000"]` if you
    # genuinely need it reachable without a proxy (e.g. local testing).
    ports:
      - "127.0.0.1:8010:8000"
    environment:
      YAOUNDE_ENV: production
      YAOUNDE_DATABASE_URL: sqlite:////app/data/app.db
      # Frontend origins allowed to call this API with cookies. These local entries let
      # `npm run dev` reach the container; replace them with your real domain on the VPS.
      YAOUNDE_CORS_ORIGINS: http://127.0.0.1:5175,http://localhost:5175
      # Enables POST /api/auth/signup and acts as the shared registration code.
      # Leave unset to disable self-service registration entirely. CHANGE THIS.
      YAOUNDE_SIGNUP_CODE: code123
    volumes:
      - francanglais-data:/app/data

volumes:
  francanglais-data:
